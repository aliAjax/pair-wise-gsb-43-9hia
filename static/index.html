<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}code{background:#edf0f2;padding:2px 5px}.bad{color:#a33}.ok{color:#23845b}</style>
<h1>公共采购密封投标与评审</h1><div class="card">公开页面只展示项目元数据，投标正文按角色和执行阶段隐藏。写接口需要 <code>X-User</code>、<code>X-Role</code>。联合体按版本冻结牵头方、成员份额与资质快照；成员变更只生成新版本，证书过期或资格暂停使原版本失效：未开标投标整组失效，已开标保留快照但拦截评分与授标。</div>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>联合体版本</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody></tbody></table>
<h2>联合体版本</h2><table id="consortiums"><thead><tr><th>联合体</th><th>版本</th><th>牵头方</th><th>成员（份额）</th><th>资质状态</th><th>版本状态</th><th>快照哈希</th><th>受影响投标</th></tr></thead><tbody></tbody></table>
<h2>审计时间线</h2><table id="timeline"><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>详情</th></tr></thead><tbody></tbody></table>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr><td>${esc(r.tender_no)}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td>${esc(r.deadline)}</td><td>${r.evaluation_round}</td><td>${r.version}</td></tr>`).join('');
  document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.consortium_version?'v'+r.consortium_version:'—'}</td><td>${r.price}</td><td>${esc(r.status)}</td><td><code>${r.payload_hash.slice(0,12)}…</code></td></tr>`).join('');
  const rows=[];
  for(const c of (d.consortiums||[]))for(const v of c.versions){
    const members=v.members.map(m=>`${esc(m.name)} ${m.share}%`).join('、');
    const quals=v.members.flatMap(m=>(m.qualifications||[]).map(q=>{
      const cls=q.current_status==='valid'?'ok':'bad';
      return `<span class="${cls}">${esc(m.name)}·${esc(q.name)}:${esc(q.current_status)}</span>`;
    })).join('<br>')||'—';
    const affected=(v.affected_bids||[]).map(b=>`#${b.id}(项目${b.tender_id},${esc(b.status)})`).join('<br>')||'—';
    const vstatus=v.status==='active'?`<span class="ok">active</span>`:`<span class="bad">${esc(v.status)}${v.invalid_reason?'：'+esc(v.invalid_reason):''}</span>`;
    rows.push(`<tr><td>${esc(c.consortium_no)} ${esc(c.name)}</td><td>v${v.version}</td><td>${c.lead_vendor?esc(c.lead_vendor.name):c.lead_vendor_id}</td><td>${members}</td><td>${quals}</td><td>${vstatus}</td><td><code>${v.snapshot_hash.slice(0,12)}…</code></td><td>${affected}</td></tr>`);
  }
  document.querySelector('#consortiums tbody').innerHTML=rows.join('');
  document.querySelector('#timeline tbody').innerHTML=d.timeline.slice(0,40).map(t=>`<tr><td>${esc(t.created_at)}</td><td>${esc(t.actor)}</td><td>${esc(t.action)}</td><td>${esc(t.details.slice(0,120))}</td></tr>`).join('');
}
load()
</script></html>
